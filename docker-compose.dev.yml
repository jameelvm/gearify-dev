version: '3.9'

# Development Docker Compose Configuration
# This setup provides hot reload for frontend development
# Run with: docker-compose -f docker-compose.dev.yml up

services:
  gearify-web:
    profiles: ["web"]  # Only start with: docker-compose -f docker-compose.dev.yml --profile web up
    build:
      context: ./gearify-web
      dockerfile: Dockerfile.dev
    container_name: gearify-web
    ports:
      - "4200:4200"
    volumes:
      # Mount source code for hot reload
      - ./gearify-web:/app
      # Prevent overwriting node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true  # Enable polling for file changes (important for Docker)
    networks:
      - gearify-network
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  gearify-network:
    external: true
