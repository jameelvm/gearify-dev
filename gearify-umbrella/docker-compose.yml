version: '3.9'

networks:
  gearify-network:
    name: gearify-network
    driver: bridge

volumes:
  localstack-data:
  postgres-data:
  redis-data:
  seq-data:
  grafana-data:
  prometheus-data:
  portainer-data:

services:
  # Infrastructure Services
  localstack:
    image: localstack/localstack-pro:latest
    container_name: gearify-localstack
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_API_KEY}
      - SERVICES=cognito-idp,dynamodb,s3,sqs,sns,ses,secretsmanager,ssm,lambda,logs,opensearch
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_EXECUTOR=docker-reuse
      - DYNAMODB_SHARE_DB=1
      - PERSISTENCE=1
      - SMTP_HOST=mailhog:1025
      - SES_SMTP_HOST=mailhog:1025
    ports:
      - "4566:4566"
    volumes:
      - "./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "./localstack/dynamodb:/etc/localstack/init/ready.d/dynamodb"
      - "./localstack/s3:/etc/localstack/init/ready.d/s3"
      - "./localstack/sqs:/etc/localstack/init/ready.d/sqs"
      - "./localstack/sns:/etc/localstack/init/ready.d/sns"
      - "./localstack/ses:/etc/localstack/init/ready.d/ses"
      - "./localstack/cognito:/etc/localstack/init/ready.d/cognito"
      - "./localstack/secretsmanager:/etc/localstack/init/ready.d/secretsmanager"
      - "./localstack/ssm:/etc/localstack/init/ready.d/ssm"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack-data:/var/lib/localstack
    networks:
      - gearify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: gearify-postgres
    environment:
      POSTGRES_DB: gearify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - gearify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gearify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gearify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Observability Services
  portainer:
    image: portainer/portainer-ce:latest
    container_name: gearify-portainer
    command: -H unix:///var/run/docker.sock
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - gearify-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gearify-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gearify-network

  seq:
    image: datalust/seq:latest
    container_name: gearify-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: admin
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - gearify-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gearify-jaeger
    ports:
      - "16686:16686"
    networks:
      - gearify-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: gearify-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - gearify-network
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: gearify-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gearify-network

  grafana:
    image: grafana/grafana:latest
    container_name: gearify-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - gearify-network
    depends_on:
      - prometheus

  # Application Services
  tenant-svc:
    build:
      context: ..
      dockerfile: gearify-tenant-svc/Dockerfile
    container_name: gearify-tenant-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - DYNAMODB_ENDPOINT=${DYNAMODB_ENDPOINT}
      - REDIS_URL=${REDIS_URL}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5008:80"
    networks:
      - gearify-network
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-svc:
    build:
      context: ..
      dockerfile: gearify-catalog-svc/Dockerfile
    container_name: gearify-catalog-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - DYNAMODB_ENDPOINT=${DYNAMODB_ENDPOINT}
      - SNS_ENDPOINT=${SNS_ENDPOINT}
      - REDIS_URL=${REDIS_URL}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5001:80"
    networks:
      - gearify-network
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-svc:
    build:
      context: ..
      dockerfile: gearify-auth-svc/Dockerfile
    container_name: gearify-auth-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - DYNAMODB_ENDPOINT=${DYNAMODB_ENDPOINT}
      - REDIS_URL=${REDIS_URL}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    ports:
      - "5011:80"
    networks:
      - gearify-network
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  search-svc:
    build:
      context: ..
      dockerfile: gearify-search-svc/Dockerfile
    container_name: gearify-search-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - OPENSEARCH_ENDPOINT=${OPENSEARCH_ENDPOINT}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - REDIS_URL=${REDIS_URL}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5012:80"
    networks:
      - gearify-network
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  cart-svc:
    build:
      context: ..
      dockerfile: gearify-cart-svc/Dockerfile
    container_name: gearify-cart-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - REDIS_URL=${REDIS_URL}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5013:80"
    networks:
      - gearify-network
    depends_on:
      redis:
        condition: service_healthy

  order-svc:
    build:
      context: ..
      dockerfile: gearify-order-svc/Dockerfile
    container_name: gearify-order-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_CONNECTION_STRING=Host=postgres;Port=5432;Database=gearify_orders;Username=postgres;Password=postgres
      - SNS_ENDPOINT=${SNS_ENDPOINT}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - MessagingConfiguration__SQS__PaymentProcessedQueueUrl=http://localstack:4566/000000000000/gearify-payment-completed-queue
      - REDIS_URL=${REDIS_URL}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5014:80"
    networks:
      - gearify-network
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-svc:
    build:
      context: ..
      dockerfile: gearify-payment-svc/Dockerfile
    container_name: gearify-payment-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_CONNECTION_STRING=Host=postgres;Port=5432;Database=gearify_payments;Username=postgres;Password=postgres
      - SNS_ENDPOINT=${SNS_ENDPOINT}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - MessagingConfiguration__SQS__OrderCreatedQueueUrl=http://localstack:4566/000000000000/gearify-order-created-queue
      - SECRETS_MANAGER_ENDPOINT=${SECRETS_MANAGER_ENDPOINT}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5015:80"
    networks:
      - gearify-network
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  shipping-svc:
    build:
      context: ..
      dockerfile: gearify-shipping-svc/Dockerfile
    container_name: gearify-shipping-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_CONNECTION_STRING=Host=postgres;Port=5432;Database=gearify_shipping;Username=postgres;Password=postgres
      - SNS_ENDPOINT=${SNS_ENDPOINT}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5006:80"
    networks:
      - gearify-network
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  inventory-svc:
    build:
      context: ..
      dockerfile: gearify-inventory-svc/Dockerfile
    container_name: gearify-inventory-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DYNAMODB_ENDPOINT=${DYNAMODB_ENDPOINT}
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5007:80"
    networks:
      - gearify-network
    depends_on:
      localstack:
        condition: service_healthy

  media-svc:
    build:
      context: ..
      dockerfile: gearify-media-svc/Dockerfile
    container_name: gearify-media-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - DYNAMODB_ENDPOINT=${DYNAMODB_ENDPOINT}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5009:80"
    networks:
      - gearify-network
    depends_on:
      localstack:
        condition: service_healthy

  notification-svc:
    build:
      context: ..
      dockerfile: gearify-notification-svc/Dockerfile
    container_name: gearify-notification-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - LocalStack__Config__LocalStackHost=localstack:4566
      - SES_ENDPOINT=http://localstack:4566
      - SQS_ENDPOINT=${SQS_ENDPOINT}
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "5010:80"
    networks:
      - gearify-network
    depends_on:
      localstack:
        condition: service_healthy
      mailhog:
        condition: service_started

  api-gateway:
    build:
      context: ..
      dockerfile: gearify-api-gateway/Dockerfile
    container_name: gearify-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - TENANT_SERVICE_URL=${TENANT_SERVICE_URL}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL}
      - SEARCH_SERVICE_URL=http://search-svc:80
      - CART_SERVICE_URL=http://cart-svc:80
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL}
      - SHIPPING_SERVICE_URL=${SHIPPING_SERVICE_URL}
      - INVENTORY_SERVICE_URL=http://inventory-svc:80
      - MEDIA_SERVICE_URL=http://media-svc:80
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_SECRET=${JWT_SECRET}
      - SEQ_URL=${SEQ_URL}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
    ports:
      - "8080:80"
    networks:
      - gearify-network
    depends_on:
      - tenant-svc
      - auth-svc
      - catalog-svc
      - search-svc
      - cart-svc
      - order-svc
      - payment-svc
      - shipping-svc
      - inventory-svc
      - media-svc
      - notification-svc

  web:
    profiles: ["web"]  # Only start with: docker-compose --profile web up
    build:
      context: ..
      dockerfile: gearify-web/Dockerfile
    container_name: gearify-web
    environment:
      - API_BASE_URL=${API_BASE_URL}
    ports:
      - "4200:80"
    networks:
      - gearify-network
    depends_on:
      - api-gateway
