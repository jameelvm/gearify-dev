<div class="filter-bar">
  <div class="filter-bar-container">
    <div class="filter-left">
    <!-- Brand Dropdown -->
    <div class="filter-dropdown">
      <button class="filter-dropdown-btn" (click)="toggleBrandDropdown(); $event.stopPropagation()">
        Brand
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          [class.rotate]="showBrandDropdown"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <ng-container *ngIf="showBrandDropdown">
        <div class="dropdown-overlay" (click)="closeAllDropdowns()"></div>
        <div class="dropdown-menu">
          <!-- Search -->
          <div class="dropdown-search">
            <input
              type="text"
              placeholder="Search by brand"
              [(ngModel)]="brandSearchQuery"
              class="search-input"
            />
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </div>

          <!-- All Brands -->
          <div class="dropdown-section">
            <div class="section-title">All Brands</div>

            <!-- Loading State -->
            <div class="checkbox-list skeleton-list" *ngIf="brandsLoading()">
              <div class="skeleton-checkbox-item" *ngFor="let item of [1,2,3,4,5,6,7,8]">
                <div class="skeleton-checkbox"></div>
                <div class="skeleton-label"></div>
                <div class="skeleton-count"></div>
              </div>
            </div>

            <!-- Error State -->
            <div class="checkbox-list" *ngIf="brandsError() && !brandsLoading()">
              <div class="error-message">{{ brandsError() }}</div>
            </div>

            <!-- Brands List -->
            <div class="checkbox-list" *ngIf="!brandsLoading() && !brandsError()">
              <label class="checkbox-item" *ngFor="let brand of filteredBrands">
                <input
                  type="checkbox"
                  [checked]="isBrandSelected(brand.slug)"
                  (change)="toggleBrand(brand.slug)"
                />
                <span class="checkbox-label">{{ brand.name }}</span>
                <span class="checkbox-count" *ngIf="brand.productCount">({{ brand.productCount }})</span>
              </label>
            </div>
          </div>

          <!-- Bottom Clear Button -->
          <div class="dropdown-actions">
            <button class="action-btn action-clear-solo" (click)="clearBrands()">Clear</button>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Price Dropdown -->
    <div class="filter-dropdown">
      <button class="filter-dropdown-btn" (click)="togglePriceDropdown(); $event.stopPropagation()">
        Price
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          [class.rotate]="showPriceDropdown"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <ng-container *ngIf="showPriceDropdown">
        <div class="dropdown-overlay" (click)="closeAllDropdowns()"></div>
        <div class="dropdown-menu">
          <!-- Loading State -->
          <div class="checkbox-list skeleton-list" *ngIf="priceRangesLoading()">
            <div class="skeleton-checkbox-item" *ngFor="let item of [1,2,3,4,5]">
              <div class="skeleton-radio"></div>
              <div class="skeleton-label"></div>
              <div class="skeleton-count"></div>
            </div>
          </div>

          <!-- Error State -->
          <div class="checkbox-list" *ngIf="priceRangesError() && !priceRangesLoading()">
            <div class="error-message">{{ priceRangesError() }}</div>
          </div>

          <!-- Price Ranges -->
          <div class="checkbox-list" *ngIf="!priceRangesLoading() && !priceRangesError()">
            <label class="checkbox-item" *ngFor="let range of priceRanges()">
              <input
                type="radio"
                name="priceRange"
                [checked]="selectedPriceRange()?.id === range.id"
                (change)="selectPriceRange(range)"
              />
              <span class="checkbox-label">{{ range.label }}</span>
              <span class="checkbox-count">({{ range.productCount }})</span>
            </label>
          </div>

          <!-- Custom Range -->
          <div class="custom-range">
            <div class="custom-range-title">Custom Range</div>
            <div class="custom-range-inputs">
              <input
                type="text"
                placeholder="Min"
                [(ngModel)]="customPriceMin"
                class="range-input"
              />
              <span class="range-separator">to</span>
              <input
                type="text"
                placeholder="Max"
                [(ngModel)]="customPriceMax"
                class="range-input"
              />
              <button class="range-go-btn" (click)="applyCustomPrice()">Go</button>
            </div>
          </div>

          <!-- Bottom Clear Button -->
          <div class="dropdown-actions">
            <button class="action-btn action-clear-solo" (click)="clearPriceRange()">Clear</button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

  <div class="filter-right">
    <!-- View Toggle -->
    <div class="view-toggle">
      <button
        class="view-btn"
        [class.active]="viewMode === 'medium'"
        (click)="setViewMode('medium')"
        title="Medium tiles"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="8" height="8" rx="1"></rect>
          <rect x="13" y="3" width="8" height="8" rx="1"></rect>
          <rect x="3" y="13" width="8" height="8" rx="1"></rect>
          <rect x="13" y="13" width="8" height="8" rx="1"></rect>
        </svg>
      </button>
      <button
        class="view-btn"
        [class.active]="viewMode === 'small'"
        (click)="setViewMode('small')"
        title="Small tiles"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="4" height="4" rx="1"></rect>
          <rect x="10" y="3" width="4" height="4" rx="1"></rect>
          <rect x="17" y="3" width="4" height="4" rx="1"></rect>
          <rect x="3" y="10" width="4" height="4" rx="1"></rect>
          <rect x="10" y="10" width="4" height="4" rx="1"></rect>
          <rect x="17" y="10" width="4" height="4" rx="1"></rect>
          <rect x="3" y="17" width="4" height="4" rx="1"></rect>
          <rect x="10" y="17" width="4" height="4" rx="1"></rect>
          <rect x="17" y="17" width="4" height="4" rx="1"></rect>
        </svg>
      </button>
    </div>

    <!-- Sort Dropdown -->
    <div class="sort-dropdown">
      <label class="sort-label">Sort by</label>
      <select class="sort-select" [(ngModel)]="selectedSort" (change)="onSortChange(selectedSort)">
        <option *ngFor="let option of sortOptions()" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
      <svg class="sort-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>
  </div>
</div>
