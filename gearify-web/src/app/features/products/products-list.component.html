<div class="products-page">
  <!-- Header -->
  <div class="page-header">
    <div class="header-content">
      <div class="title-section">
        <h1 class="page-title">Products</h1>
        <p class="results-count">{{ totalItems() }} products found</p>
      </div>

      <div class="header-actions">
        <!-- Search Bar -->
        <div class="search-box">
          <input
            type="text"
            class="search-input"
            placeholder="Search products..."
            [value]="searchQuery()"
            (input)="onSearch($any($event.target).value)"
          />
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </div>

        <!-- Sort Dropdown -->
        <div class="sort-dropdown">
          <label class="sort-label">Sort by:</label>
          <select
            class="sort-select"
            [value]="sortField()"
            (change)="onSortChange($any($event.target).value)"
          >
            <option *ngFor="let option of sortOptions" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </div>

        <!-- View Toggle -->
        <div class="view-toggle">
          <button
            class="view-button"
            [class.active]="viewMode() === 'grid'"
            (click)="setViewMode('grid')"
            aria-label="Grid view"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            </svg>
          </button>
          <button
            class="view-button"
            [class.active]="viewMode() === 'list'"
            (click)="setViewMode('list')"
            aria-label="List view"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Mobile Filter Toggle -->
        <button class="mobile-filter-toggle" (click)="toggleFilters()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          Filters
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="products-container">
    <!-- Filters Sidebar -->
    <aside class="filters-sidebar" [class.show]="showFilters()">
      <div class="filters-header">
        <h2 class="filters-title">Filters</h2>
        <button class="clear-filters-btn" (click)="clearFilters()">
          Clear All
        </button>
      </div>

      <!-- Category Filter -->
      <div class="filter-group">
        <h3 class="filter-title">Category</h3>
        <div class="filter-options">
          <label class="filter-option">
            <input
              type="radio"
              name="category"
              [value]="''"
              [checked]="selectedCategory() === ''"
              (change)="onCategoryChange('')"
            />
            <span class="filter-label">All Categories</span>
          </label>
          <label class="filter-option" *ngFor="let category of categories()">
            <input
              type="radio"
              name="category"
              [value]="category"
              [checked]="selectedCategory() === category"
              (change)="onCategoryChange(category)"
            />
            <span class="filter-label">{{ category }}</span>
          </label>
        </div>
      </div>

      <!-- Brand Filter -->
      <div class="filter-group">
        <h3 class="filter-title">Brand</h3>
        <div class="filter-options">
          <label class="filter-option">
            <input
              type="radio"
              name="brand"
              [value]="''"
              [checked]="selectedBrand() === ''"
              (change)="onBrandChange('')"
            />
            <span class="filter-label">All Brands</span>
          </label>
          <label class="filter-option" *ngFor="let brand of brands()">
            <input
              type="radio"
              name="brand"
              [value]="brand"
              [checked]="selectedBrand() === brand"
              (change)="onBrandChange(brand)"
            />
            <span class="filter-label">{{ brand }}</span>
          </label>
        </div>
      </div>

      <!-- Price Range Filter -->
      <div class="filter-group">
        <h3 class="filter-title">Price Range</h3>
        <div class="price-range">
          <div class="price-inputs">
            <div class="price-input-group">
              <label class="price-label">Min</label>
              <input
                type="number"
                class="price-input"
                [value]="priceRange().min"
                (change)="onPriceRangeChange($any($event.target).valueAsNumber, priceRange().max)"
                min="0"
                step="10"
              />
            </div>
            <span class="price-separator">-</span>
            <div class="price-input-group">
              <label class="price-label">Max</label>
              <input
                type="number"
                class="price-input"
                [value]="priceRange().max"
                (change)="onPriceRangeChange(priceRange().min, $any($event.target).valueAsNumber)"
                min="0"
                step="10"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Filter Actions -->
      <div class="mobile-filter-actions">
        <app-button
          variant="outline"
          [fullWidth]="true"
          (clicked)="clearFilters()"
        >
          Clear Filters
        </app-button>
        <app-button
          variant="primary"
          [fullWidth]="true"
          (clicked)="toggleFilters()"
        >
          Show {{ totalItems() }} Products
        </app-button>
      </div>
    </aside>

    <!-- Products Grid/List -->
    <main class="products-main">
      <!-- Empty State -->
      <div class="empty-state" *ngIf="paginatedProducts().length === 0">
        <svg class="empty-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <h2 class="empty-title">No products found</h2>
        <p class="empty-description">
          Try adjusting your search or filter criteria to find what you're looking for.
        </p>
        <app-button variant="primary" (clicked)="clearFilters()">
          Clear Filters
        </app-button>
      </div>

      <!-- Products Grid -->
      <div
        class="products-grid"
        [class.grid-view]="viewMode() === 'grid'"
        [class.list-view]="viewMode() === 'list'"
        *ngIf="paginatedProducts().length > 0"
      >
        <app-product-card
          *ngFor="let product of paginatedProducts(); track product.id"
          [product]="product"
          [compact]="viewMode() === 'list'"
          (productClicked)="onProductClick($event)"
          (addToCart)="onAddToCart($event)"
          (toggleWishlist)="onToggleWishlist($event)"
        />
      </div>

      <!-- Pagination -->
      <div class="pagination-container" *ngIf="paginatedProducts().length > 0">
        <app-pagination
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          [totalItems]="totalItems()"
          [itemsPerPage]="itemsPerPage()"
          [itemsPerPageOptions]="[12, 24, 48]"
          [showJumpToPage]="false"
          [showItemsPerPageSelector]="true"
          [showTotalItems]="true"
          (pageChanged)="onPageChange($event)"
        />
      </div>
    </main>
  </div>
</div>

<!-- Filter Overlay (Mobile) -->
<div class="filter-overlay" [class.show]="showFilters()" (click)="toggleFilters()"></div>
