<div class="products-page">
  <!-- Filter Bar -->
  <app-filter />

  <!-- Main Content -->
  <div class="products-container">
    <!-- Products Grid/List -->
    <main class="products-main">
      <!-- Loading State -->
      <div class="loading-state" *ngIf="isLoading()">
        <div class="spinner"></div>
        <p>Loading products...</p>
      </div>

      <!-- Error State -->
      <div class="error-state" *ngIf="error() && !isLoading()">
        <svg class="error-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h2 class="error-title">Error Loading Products</h2>
        <p class="error-description">{{ error() }}</p>
        <app-button variant="primary" (clicked)="loadProducts()">
          Try Again
        </app-button>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="paginatedProducts().length === 0 && !isLoading() && !error()">
        <svg class="empty-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <h2 class="empty-title">No products found</h2>
        <p class="empty-description">
          Try adjusting your search or filter criteria to find what you're looking for.
        </p>
        <app-button variant="primary" (clicked)="clearFilters()">
          Clear Filters
        </app-button>
      </div>

      <!-- Products Grid -->
      <div
        class="products-grid"
        [class.grid-view]="viewMode() === 'grid'"
        [class.list-view]="viewMode() === 'list'"
        *ngIf="paginatedProducts().length > 0 && !isLoading() && !error()"
      >
        <app-product-card
          *ngFor="let product of paginatedProducts()"
          [product]="product"
          [compact]="viewMode() === 'list'"
          (productClicked)="onProductClick($event)"
          (addToCart)="onAddToCart($event)"
          (toggleWishlist)="onToggleWishlist($event)"
        />
      </div>

      <!-- Pagination -->
      <div class="pagination-container" *ngIf="paginatedProducts().length > 0 && !isLoading() && !error()">
        <app-pagination
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          [totalItems]="totalItems()"
          [itemsPerPage]="itemsPerPage()"
          [itemsPerPageOptions]="[12, 24, 48]"
          [showJumpToPage]="false"
          [showItemsPerPageSelector]="true"
          [showTotalItems]="true"
          (pageChanged)="onPageChange($event)"
        />
      </div>
    </main>
  </div>
</div>
