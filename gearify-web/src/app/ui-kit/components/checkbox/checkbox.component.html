<div class="checkbox-wrapper">
  <label
    class="checkbox-container"
    [class.checkbox-disabled]="disabled"
    [class.checkbox-error]="error"
  >
    <div
      class="checkbox-input-wrapper"
      [class.checkbox-checked]="checked()"
      [class.checkbox-indeterminate]="indeterminate"
      [class.checkbox-focused]="focused()"
      tabindex="0"
      role="checkbox"
      [attr.aria-checked]="indeterminate ? 'mixed' : checked()"
      [attr.aria-disabled]="disabled"
      [attr.aria-label]="label || 'Checkbox'"
      [attr.aria-invalid]="!!error"
      (click)="toggleChecked()"
      (keydown)="onKeyDown($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    >
      <!-- Hidden native checkbox for form compatibility -->
      <input
        type="checkbox"
        class="checkbox-native"
        [checked]="checked()"
        [disabled]="disabled"
        [indeterminate]="indeterminate"
        tabindex="-1"
        aria-hidden="true"
      />

      <!-- Custom checkbox visual -->
      <div class="checkbox-box">
        @if (indeterminate) {
          <svg
            class="checkbox-icon checkbox-icon-indeterminate"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M6 12H18"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
        } @else if (checked()) {
          <svg
            class="checkbox-icon checkbox-icon-checked"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M5 12L10 17L20 7"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      </div>
    </div>

    @if (label) {
      <span class="checkbox-label">{{ label }}</span>
    }
  </label>

  @if (error) {
    <span class="checkbox-error-message" role="alert">{{ error }}</span>
  }
</div>
