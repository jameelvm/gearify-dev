<article
  class="product-card"
  [class.product-card--compact]="compact"
  (click)="onCardClick()"
  role="button"
  tabindex="0"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()"
  [attr.aria-label]="'Product: ' + product.name">

  <!-- Image Container -->
  <div class="product-card__image-container">
    <img
      [src]="primaryImageUrl"
      [alt]="product.name"
      class="product-card__image"
      [class.product-card__image--loaded]="imageLoaded"
      loading="lazy"
      (load)="onImageLoad()"
      (error)="onImageError($event)">

    <!-- Image Skeleton Loader -->
    <div class="product-card__image-skeleton" *ngIf="!imageLoaded"></div>
  </div>

  <!-- Product Info -->
  <div class="product-card__content">
    <!-- Brand -->
    <div class="product-card__brand" *ngIf="product.brand">
      {{ product.brand }}
    </div>

    <!-- Product Name -->
    <h3 class="product-card__title">
      {{ product.name }}
    </h3>

    <!-- Price -->
    <div class="product-card__price">
      <app-price-tag
        [price]="product.price"
        [compareAtPrice]="product.compareAtPrice"
        [currency]="product.currency"
        size="medium">
      </app-price-tag>
    </div>

    <!-- Rating -->
    <div class="product-card__rating" *ngIf="product.rating">
      <app-rating
        [rating]="product.rating.average"
        [count]="product.rating.count">
      </app-rating>
    </div>
  </div>
</article>
